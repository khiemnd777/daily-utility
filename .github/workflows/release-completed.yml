name: Release completed

on:
  push:
    branches: [main]
    paths:
      - "products/**/product-manifest.json"
      - "products/**/publication.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: release-completed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install -r factory/requirements.txt

      - name: Validate release records
        run: python factory/scripts/validate_manifest.py

      - name: Reconcile published issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const productsRoot = path.join(process.env.GITHUB_WORKSPACE, 'products');
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'state:published'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'state:published',
                color: '0969da',
                description: 'Published'
              });
            }

            const stateLabels = new Set([
              'state:ready-for-build',
              'state:approved-build',
              'state:building',
              'state:ready-for-release',
              'state:approved-release',
              'state:published',
              'state:rejected'
            ]);

            for (const entry of fs.readdirSync(productsRoot, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;

              const productRoot = path.join(productsRoot, entry.name);
              const manifestPath = path.join(productRoot, 'product-manifest.json');
              if (!fs.existsSync(manifestPath)) continue;

              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              if (manifest.state !== 'PUBLISHED') continue;

              const publicationPath = path.join(productRoot, 'publication.json');
              const publication = JSON.parse(fs.readFileSync(publicationPath, 'utf8'));
              const salesChannels = publication.schema_version === 1
                ? [{
                    channel: publication.channel,
                    url: publication.url,
                    price: publication.price,
                    published_at: publication.published_at,
                    delivered_artifact_sha256: publication.artifact_sha256
                  }]
                : publication.sales_channels;
              const issueNumber = manifest.source_issue;
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              const labels = issue.labels.map((label) =>
                typeof label === 'string' ? label : label.name
              );
              if (!labels.includes('factory:proposal')) {
                throw new Error(`Issue #${issueNumber} is not a factory proposal.`);
              }

              const activeStates = labels.filter((label) => stateLabels.has(label));
              if (activeStates.length !== 1) {
                throw new Error(
                  `Issue #${issueNumber} must have exactly one state label; found ${activeStates.length}.`
                );
              }
              const allowedReleaseStates = new Set([
                'state:approved-release',
                'state:published'
              ]);
              if (!allowedReleaseStates.has(activeStates[0])) {
                throw new Error(
                  `Issue #${issueNumber} must be APPROVED_RELEASE before release completion; found ${activeStates[0]}.`
                );
              }

              if (activeStates[0] === 'state:approved-release') {
                const nextLabels = labels.filter((label) => !stateLabels.has(label));
                nextLabels.push('state:published');
                await github.rest.issues.setLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: nextLabels
                });
              }

              const marker = `<!-- release-completed:${manifest.product_id}:${publication.artifact_sha256} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              if (!comments.some((comment) => comment.body?.includes(marker))) {
                const salesEvidence = salesChannels.flatMap((sale) => [
                  `- ${sale.channel}: ${sale.url}`,
                  `  - Price: $${(sale.price.amount_cents / 100).toFixed(2)} USD`,
                  `  - Delivered SHA-256: \`${sale.delivered_artifact_sha256}\``,
                  `  - Published at: ${sale.published_at}`
                ]);
                const catalogEvidence = publication.catalog
                  ? [
                      `- KNA Software: ${publication.catalog.url}`,
                      `  - Published at: ${publication.catalog.published_at}`,
                      `  - Gumroad link verified at: ${publication.catalog.gumroad_link_verified_at}`,
                      `  - Lemon Squeezy link verified at: ${publication.catalog.lemon_squeezy_link_verified_at}`
                    ]
                  : [];
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: [
                    marker,
                    'Factory state: **APPROVED_RELEASE** → **PUBLISHED** via `release_completed`.',
                    '',
                    `- Product: \`${manifest.product_id}\``,
                    ...salesEvidence,
                    ...catalogEvidence,
                    `- Artifact: \`${publication.artifact}\``,
                    `- SHA-256: \`${publication.artifact_sha256}\``,
                    '',
                    'The release was published manually after approval. This job only verified and recorded the checked-in evidence; it did not call a sales or publishing API.'
                  ].join('\n')
                });
              } else {
                core.info(`Issue #${issueNumber} already has this release record.`);
              }
            }
