name: Manifest check

on:
  pull_request:
    paths:
      - "factory/**"
      - "products/**"
      - "templates/product-manifest.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "factory/**"
      - "products/**"
      - "templates/product-manifest.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install -r factory/requirements.txt
      - name: Validate schema, state machine, and manifests
        run: python factory/scripts/validate_manifest.py
