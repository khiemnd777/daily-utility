name: MIDI Pack Preflight

on:
  pull_request:
    paths:
      - "products/midi-pack-preflight/**"
      - ".github/workflows/midi-pack-preflight-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/midi-pack-preflight
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/midi-pack-preflight/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate product manifest
        working-directory: .
        run: python3 factory/scripts/validate_manifest.py
      - name: Run unit and release checks
        run: npm test
      - name: Install Chromium test runtime
        run: npx playwright-core install --with-deps chromium
      - name: Run offline browser acceptance
        run: npm run test:browser:ci
