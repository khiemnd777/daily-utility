name: Daily idea intake

on:
  schedule:
    # 07:00 Asia/Ho_Chi_Minh (UTC+7)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      proposal_title:
        description: Optional title for the manual proposal shell
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-idea-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automation
        if: ${{ vars.FACTORY_AUTOMATION_ENABLED != 'true' }}
        run: |
          echo "Daily idea automation is disabled."
          echo "No OpenAI/Codex credential or execution is configured."

      - name: Create a manual proposal shell
        if: ${{ vars.FACTORY_AUTOMATION_ENABLED == 'true' }}
        uses: actions/github-script@v7
        env:
          REQUESTED_TITLE: ${{ inputs.proposal_title }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const requested = process.env.REQUESTED_TITLE?.trim();
            const title = requested || `[Idea intake ${date}] Manual proposal required`;

            const labelDefinitions = {
              'factory:proposal': ['5319e7', 'Factory proposal'],
              'state:ready-for-build': ['d4c5f9', 'Awaiting build approval']
            };
            for (const [name, [color, description]] of Object.entries(labelDefinitions)) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name,
                  color,
                  description
                });
              }
            }

            const body = [
              '## Problem',
              'Describe one narrow, recurring problem.',
              '',
              '## Target customer',
              'Name the person who experiences it.',
              '',
              '## Proposed utility',
              'Describe the smallest useful solution.',
              '',
              '## Distribution and price',
              'Propose a delivery format and USD price.',
              '',
              '## Acceptance checks',
              '- [ ] Scope is buildable in one focused cycle',
              '- [ ] No credentials or customer data are required',
              '- [ ] Reviewer has assessed the proposal',
              '',
              '> This is a manual shell. No OpenAI/Codex execution is configured.',
              '',
              'Reviewer command: `/approve` or `/reject`'
            ].join('\n');

            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ['factory:proposal', 'state:ready-for-build']
            });
